name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          bun install --frozen-lockfile

      # Modo comprobación: sin un paso que suba los arreglos, el modo escritura
      # corregía en la máquina de CI y el job salía verde con el código sin
      # formatear.
      - name: Check Pint
        run: composer lint:check

      - name: Check Frontend Format
        run: bun run format:check

      - name: Lint Frontend
        run: bun run lint:check
